name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://pkpgxtvdxkqfadpqvvoz.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrcGd4dHZkeGtxZmFkcHF2dm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzkyMDgsImV4cCI6MjEwOTgxNTIwOH0.QU67gkKEd0fB8Mtv1yOHdlBViUTJKpUbEm7gZq2qvic" >> .env

      - name: Generate release keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/release.keystore \
              -alias sahab \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass sahab2026 \
              -keypass sahab2026 \
              -dname "CN=SahabPOS, OU=Mobile, O=Sahab, L=Riyadh, ST=Riyadh, C=SA"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PSAHAB_UPLOAD_STORE_FILE=release.keystore \
            -PSAHAB_UPLOAD_STORE_PASSWORD=sahab2026 \
            -PSAHAB_UPLOAD_KEY_ALIAS=sahab \
            -PSAHAB_UPLOAD_KEY_PASSWORD=sahab2026

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/Sahab-POS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahab-POS-APK
          path: android/app/build/outputs/apk/release/Sahab-POS.apk
          retention-days: 30

      - name: Upload debug APK (fallback)
        if: failure()
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sahab-POS-debug.apk

      - name: Upload debug APK artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sahab-POS-Debug-APK
          path: Sahab-POS-debug.apk
          retention-days: 7
