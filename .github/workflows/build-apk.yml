name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://pkpgxtvdxkqfadpqvvoz.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrcGd4dHZkeGtxZmFkcHF2dm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzkyMDgsImV4cCI6MjEwOTgxNTIwOH0.QU67gkKEd0fB8Mtv1yOHdlBViUTJKpUbEm7gZq2qvic" >> .env

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/Sahab-POS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahab-POS-APK
          path: android/app/build/outputs/apk/release/Sahab-POS.apk
          retention-days: 30

      - name: Upload debug APK (fallback)
        if: failure()
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sahab-POS-debug.apk

      - name: Upload debug APK artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sahab-POS-Debug-APK
          path: Sahab-POS-debug.apk
          retention-days: 7
